
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SkillBridge</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

    <header class="auth-nav">
        <a href="index.html" class="logo">Skill<span>Bridge</span></a>
        <a href="index.html" class="back-link">← Back to home</a>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-icon">✦</div>

            <p class="eyebrow">START YOUR JOURNEY</p>
            <h1>Create your account</h1>
            <p class="auth-description">
                Join SkillBridge and turn learning into real-world skills.
            </p>

            <form id="register-form">
                <label for="register-name">Full name</label>
                <input
                    type="text"
                    id="register-name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    minlength="2"
                    required
                >

                <label for="register-email">Email address</label>
                <input
                    type="email"
                    id="register-email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <label for="register-password">Password</label>
                <input
                    type="password"
                    id="register-password"
                    name="password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirm-password">Confirm password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label class="terms-label">
                    <input type="checkbox" id="accept-terms" required>
                    I agree to the terms of use and privacy policy.
                </label>

                <p id="register-message" class="auth-message" role="status"></p>

                <button type="submit" class="auth-submit">
                    Create Account →
                </button>
            </form>

            <p class="auth-switch">
                Already registered?
                <a href="login.html">Login here</a>
            </p>
        </section>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
