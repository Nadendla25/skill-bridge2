
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SkillBridge</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

    <header class="auth-nav">
        <a href="index.html" class="logo">Skill<span>Bridge</span></a>
        <a href="index.html" class="back-link">← Back to home</a>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-icon">✦</div>

            <p class="eyebrow">WELCOME BACK</p>
            <h1>Login to SkillBridge</h1>
            <p class="auth-description">
                Continue your learning journey and build your future.
            </p>

            <form id="login-form">
                <label for="login-email">Email address</label>
                <input
                    type="email"
                    id="login-email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <label for="login-password">Password</label>
                <input
                    type="password"
                    id="login-password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <div class="auth-options">
                    <label class="remember-label">
                        <input type="checkbox" id="remember-me">
                        Remember me
                    </label>

                    <a href="#" id="forgot-password">Forgot password?</a>
                </div>

                <p id="login-message" class="auth-message" role="status"></p>

                <button type="submit" class="auth-submit">
                    Login →
                </button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create account</a>
            </p>
        </section>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
