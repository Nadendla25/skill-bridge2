
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SkillBridge</title>
    <meta name="description" content="Log in to SkillBridge and continue your learning journey.">

    <!-- Website and authentication styles -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./auth.css">
</head>

<body class="auth-page">

    <!-- Navigation -->
    <header class="auth-nav">
        <a href="./index.html" class="logo">
            Skill<span>Bridge</span>
        </a>

        <a href="./index.html" class="back-link">
            &larr; Back to home
        </a>
    </header>

    <!-- Login section -->
    <main class="auth-container">
        <section class="auth-card">

            <div class="auth-icon" aria-hidden="true">&#10022;</div>

            <p class="eyebrow">WELCOME BACK</p>

            <h1>Login to SkillBridge</h1>

            <p class="auth-description">
                Continue your learning journey and build your future.
            </p>

            <form id="login-form">
                <label for="login-email">Email address</label>

                <input
                    type="email"
                    id="login-email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <label for="login-password">Password</label>

                <input
                    type="password"
                    id="login-password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <div class="auth-options">
                    <label class="remember-label" for="remember-me">
                        <input
                            type="checkbox"
                            id="remember-me"
                            name="remember"
                        >
                        Remember me
                    </label>

                    <a href="#" id="forgot-password">
                        Forgot password?
                    </a>
                </div>

                <p
                    id="login-message"
                    class="auth-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button type="submit" class="auth-submit">
                    Login &rarr;
                </button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="./register.html">Create account</a>
            </p>

        </section>
    </main>

    <!-- Login functionality -->
    <script src="./auth.js" defer></script>

</body>
</html>
